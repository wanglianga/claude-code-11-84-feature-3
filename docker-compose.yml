services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ccdev
      POSTGRES_USER: ccdev
      POSTGRES_PASSWORD: ccdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccdev -d ccdev"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres:5432
      DB_NAME: ccdev
      DB_USER: ccdev
      DB_PASS: ccdev
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  pgdata:
